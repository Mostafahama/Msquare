<section class="capabilities-explorer dark-atmosphere" id="services" #explorerSec>
  <div class="container">

    <!-- ═══ HEADER & TWO-MODE SWITCHER ═══ -->
    <div class="explorer-header">
      <div class="header-text-block">
        <p class="eyebrow">{{ lang.t().wipePanels.eyebrow }}</p>
        <h2 class="explorer-title" #secTitle>
          {{ lang.t().wipePanels.titleMain }} <span class="word-sweep">{{ lang.t().wipePanels.titleHighlight }}</span>
        </h2>
        <p class="explorer-sub">
          {{ lang.t().wipePanels.subtitle }}
        </p>
      </div>

      <!-- Two-Mode Switcher -->
      <div class="mode-switcher-wrap" role="tablist" aria-label="Capabilities view modes">
        <button
          type="button"
          class="mode-switch-btn"
          role="tab"
          [class.active]="activeMode === 'services'"
          [attr.aria-selected]="activeMode === 'services'"
          (click)="setMode('services')">
          <span class="mode-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 7h6M9 12h6M9 17h4"/>
            </svg>
          </span>
          <span>{{ lang.t().wipePanels.tabServices }}</span>
        </button>

        <button
          type="button"
          class="mode-switch-btn"
          role="tab"
          [class.active]="activeMode === 'internships'"
          [attr.aria-selected]="activeMode === 'internships'"
          (click)="setMode('internships')">
          <span class="mode-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </span>
          <span>{{ lang.t().wipePanels.tabInternships }}</span>
        </button>
      </div>
    </div>

    <!-- ═══ TWO-COLUMN EXPLORER ARCHITECTURE ═══ -->
    @if (activeMode === 'services') {
      <app-services></app-services>
    } @else {
      <app-internships></app-internships>
    }

  </div>
</section>
